<!doctype html>
<!-- yavih figure, kind depth: three image to depth pairs. Filled by `python -m yavih.previews <name>` (yavih.previews); fields are
     string.Template placeholders: $base_css the design system, $page_css the page box, then the kind's layout. -->
<html><head><meta charset="utf-8"><style>
$base_css
$page_css
.figbody{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.pairbox{display:flex;flex-direction:column;gap:10px;justify-content:center}
.pair .tile{flex:1 1 0;aspect-ratio:4/3}
</style></head><body class="ds" data-bench="$bench"><div class="fig">
<div class="figbar"><div><div class="kicker">$kicker</div><div class="figtitle">$title</div></div><div class="chips">$chips</div></div>
<div class="figbody">$body</div>
</div></body></html>
