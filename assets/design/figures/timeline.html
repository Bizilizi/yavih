<!doctype html>
<!-- yavih figure, kind timeline: frames over the labelled intervals of a video. Filled by `python -m yavih.previews <name>` (yavih.previews); fields are
     string.Template placeholders: $base_css the design system, $page_css the page box, then the kind's layout. -->
<html><head><meta charset="utf-8"><style>
$base_css
$page_css
.figbody{display:flex;flex-direction:column;gap:16px}
.strip .frame{aspect-ratio:16/9}
.track{display:flex;flex-direction:column;gap:6px}
.timeline{height:38px}
</style></head><body class="ds" data-bench="$bench"><div class="fig">
<div class="figbar"><div><div class="kicker">$kicker</div><div class="figtitle">$title</div></div><div class="chips">$chips</div></div>
<div class="figbody">$body</div>
</div></body></html>
