<!doctype html>
<!-- yavih figure, kind classes: class names with counts, no media (licence-restricted data). Filled by `python -m yavih.previews <name>` (yavih.previews); fields are
     string.Template placeholders: $base_css the design system, $page_css the page box, then the kind's layout. -->
<html><head><meta charset="utf-8"><style>
$base_css
$page_css
.figbody{display:flex;flex-direction:column;gap:18px}
.cloud{flex-wrap:wrap;gap:10px;font-size:16px}
.cloud .chip{font-family:var(--sans);color:var(--ink);padding:7px 14px}
.cloud .chip b{font-family:var(--mono);color:var(--a);margin-left:6px}
</style></head><body class="ds" data-bench="$bench"><div class="fig">
<div class="figbar"><div><div class="kicker">$kicker</div><div class="figtitle">$title</div></div><div class="chips">$chips</div></div>
<div class="figbody">$body</div>
</div></body></html>
