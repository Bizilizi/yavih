<!doctype html>
<!-- yavih figure, kind av: frames and the waveform on one time axis, the events as bands. Filled by `python -m yavih.previews <name>` (yavih.previews); fields are
     string.Template placeholders: $base_css the design system, $page_css the page box, then the kind's layout. -->
<html><head><meta charset="utf-8"><style>
$base_css
$page_css
.figbody{display:flex;flex-direction:column;gap:8px}
.stack{position:relative;display:flex;flex-direction:column;gap:12px;padding:10px 0}
.spans{position:absolute;inset:0;pointer-events:none}
.spans .band{z-index:2;border-width:2px;border-style:solid;background:rgba(34,211,238,.08)}
.spans .band .lab{top:6px;transform:none;left:6px;padding:2px 8px;border-radius:6px;background:rgba(7,10,18,.82);color:var(--a)}
.spans .band.b .lab{color:var(--b)}.spans .band.c .lab{color:var(--c)}
.strip .frame{aspect-ratio:16/9}
.sig{display:flex;flex-direction:column;gap:6px}
.sig .wave{height:72px}.sig .spec{height:150px;object-fit:fill}
.ticks{margin-top:4px}
</style></head><body class="ds" data-bench="$bench"><div class="fig">
<div class="figbar"><div><div class="kicker">$kicker</div><div class="figtitle">$title</div></div><div class="chips">$chips</div></div>
<div class="figbody">$body</div>
</div></body></html>
