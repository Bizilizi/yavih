# The fleet's work queue: one entry per candidate benchmark, seeded from a survey of video, audio and audio-visual
# encoder benchmarks (October 2026, papers through 2026-09). It reserves each folder's name, says how the benchmark
# would be scored, and records who is doing what. `python fleet/check.py queue` validates it.
#
# Entry keys:
#   name          the reserved folder name, [a-z][a-z0-9_]*, unique; `<dataset>_<task>` where a dataset has several tasks
#   title         the benchmark as the survey names it
#   kind          benchmark (one folder) | suite (a set of other entries, listed in `components`; a suite file, not a folder)
#   survey_class  A    fits a core scorer as is
#                 B1   needs a trained head no core scorer has (tracking, detection, segmentation, regression, ...)
#                 B2   needs a text side (i), a training-free scorer (ii) or the model's own predictions (iii)
#                 null not in the survey (an existing folder or one built elsewhere)
#   survey_reasons  B2 only: the subset of [i, ii, iii]
#   route         how to build it: core-clf | core-seq | core-grid | core-box | core-knn | core-stream (a core scorer as
#                 is); folder-probe | folder-stateless | folder-direct (the folder's own eval.py scorer of that kind,
#                 docs/extending-through-a-folder.md); suite. A worker may pick a better route and says why.
#   text_fields   the protocol hands the model text (B2 reason i)
#   parents       the suite entries that list this benchmark
#   components    suites only: the entries the suite lists
#   survey_note   the survey's one-line reason and caveats (subsets, borderline cases)
#   status        todo | claimed | in_flight | blocked | review | shipped | dropped
#                 shipped and in_flight entries name a folder that exists or is being built elsewhere
#   obtain        filled by the worker: the obtain tier (auto | manual-download | needs-licence | needs-data-owner | site-only)
#   blocked_by    filled by the worker when blocked: the exact action that unblocks it
#   branch        filled when claimed: bench/<name>
