header:
  name: EPIC-SOUNDS detection
  title: 'EPIC-SOUNDS: A Large-Scale Dataset of Actions that Sound'
  venue: Huh, Chalk, Kazakos, Damen, Zisserman · TPAMI 2025
  abstract: Audio annotations of the untrimmed egocentric kitchen recordings of EPIC-KITCHENS-100, with the
    temporal extent and class of every audible interaction (44 classes). The detection task localizes and
    classifies all of them in each full recording; it is scored by mean average precision over temporal IoU
    thresholds 0.1 to 0.5.
  chips: ["audio", "temporal detection", "632 recordings", "44 classes", "495 train · 137 eval", "C10 mAP, tIoU 0.1–0.5"]
