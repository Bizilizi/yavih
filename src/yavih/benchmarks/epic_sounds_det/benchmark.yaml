  licence: EPIC-SOUNDS annotations and EPIC-KITCHENS-100 videos are both CC BY-NC 4.0 (non-commercial; credit the
    authors). Cite Huh et al. (TPAMI 2025) and Damen et al. (IJCV 2022).
  revision: epic-sounds-annotations@57a922f0d352e9429f1ef8a37eee21758dd3a33c; C10-epic-sounds-detection@196e7cf2c4f17946279fb57d9ff24516b7403344;
    epic-kitchens-download-scripts@4f11fb2b579833f360c3c7bb917bf1e24a9787b5
  bytes: 1114703000000
