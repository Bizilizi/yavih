    EPIC_Sounds_train.csv: 225427ab288cc5c72c1680abb29f5ab8ccd3608c3f4cf409541d2c5cf720dd32
    EPIC_Sounds_validation.csv: fff66485d8478762fd9cde1a829e6d91713a5f2f7f917e3af746cf891dd62e5a
    EPIC_Sounds_recognition_test_timestamps.csv: 4912b017f96e371b3d05ef6194fb2796ecffff3782eacf8909a3cbaf2af4ef3a
    EPIC_Sounds_detection_test_videos.csv: b77ec524fdd64be5b01db6bc8472a983d58acb767c854e3d40ac98cdf4ec9bc3
    epic-kitchens-download-scripts/data/md5.csv: 3f9c31899ff5807c8f0fed5d26a8fe62300f3f4c40dc3eea767345212c2e83c7
    C10 EvaluationCode/audio_based_interaction_detection.py: 7c2c2509bc162e2067993def4acb392aa20077fd618a97cee2b9ecc0f5ad4338
  notes: The labels are the public EPIC-SOUNDS train and validation CSVs; the media are the EPIC-KITCHENS-100
    MP4s (1080p, 50 or 59.94 fps, AAC 48 kHz stereo) on data.bris.ac.uk, md5-checked against the download-scripts
    list. Only the AAC track of each MP4 is kept (copied, never re-encoded). The detection test split (23
    recordings) and the recognition test split (44) have no public labels and are not part of the protocol.
obtain:
  tier: auto
  how: Unattended. Step 01 fetches the annotation CSVs and the md5 list from GitHub; step 02 downloads each of the
    632 EPIC-KITCHENS-100 MP4s (1.11 TB in total, public HTTPS, no account), keeps its audio track (~6 GB) and
    deletes the MP4. Expect days at the ~2 MB/s per connection data.bris.ac.uk serves.
budget:
