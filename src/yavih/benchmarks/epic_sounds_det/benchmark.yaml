protocol_version: 1
changelog:
- version: 1
  date: '2026-10-29'
  invalidates: false
  reason: first protocol of EPIC-SOUNDS sound detection; train 495 / validation 137 recordings, official C10 mAP
  protocol_hash: f8e9f5ae4818769ebda47464a89e1b73275ee40eb1378e455867af2a02665255
