# ssv2 — schema 2; people read README.md, the agent reads setup.md first.
# Values under `manifest` are produced by make_manifest.py from the official label files (`--check` confirms them).
schema_version: 2
name: ssv2
aliases: []
title: Something-Something-v2 temporal action classification (frozen 20k class-balanced train draw, full 24 777 val)
header:
  name: Something-Something v2
  title: The "Something Something" Video Database for Learning and Evaluating Visual Common Sense
  venue: "Goyal et al. · ICCV 2017"
  abstract: >-
    220 847 short crowd-sourced clips of people performing 174 template actions with everyday objects, such as
    pushing something from left to right or pretending to put something down. Classes are object-agnostic and
    differ in motion and temporal order, so recognising them requires more than scene or object appearance.
readout: clf
protocol_version: 1
changelog:
  - version: 1
    date: "2026-10-12"
    reason: Initial release.
    invalidates: false
    protocol_hash: 641928e796bd0eda4ac0df9bdac78e77b0b7b115bb91466bf72dec2d79c0d9c7
    input_hash: e15958addf12bf79316553fd2efde9ec15e5df8a63587125fa16275815b5a214
    supersedes: []

source:
  kind: manual_portal
  urls:
    - "https://developer.qualcomm.com/software/ai-datasets/something-something"
    - "https://arxiv.org/abs/1706.04261"
  licence: >-
    Something-Something v2 (TwentyBN, now distributed by Qualcomm Technologies): free download after
    registration and acceptance of the dataset licence on the Qualcomm developer portal; research use under
    those terms, no redistribution of the videos. Read the current terms on the portal before staging. The
    Hugging Face repo HuggingFaceM4/something_something_v2 hosts NO media (loading script only).
  bytes: 19450115851
  sha256:
    "20bn-something-something-download-package-labels.zip": "8e9859f2862c3626dd1cd013dbc0bccccc12ab48d7c18812e3f302988d6f2c0c"
    "20bn-something-something-v2-00": "aab5bf3badcdf58aed2ac4b6c219a910ea97069b346bcb3ab19202b42dc8f0aa"
    "20bn-something-something-v2-01": "65b505fd26e7e72b745421d33508a5b5fcb7544c6b5510e39aa754282bad8d24"
    "labels/labels.json": "d98d8b657a5d418d7c05dbf630dedd34763025b3d764ceef19bbfd1dc654f54f"
    "labels/train.json": "b24e46090960a49d732a0d3633fd939030b4eb717e16728871a3180b8704192b"
    "labels/validation.json": "fbdd69ac72b40b9e3ed3aaf484e1575777152565caed693b0ced2d4959fd3958"
    "labels/test.json": "60702636202db04cf60c76c76905d821b8fb281376fc1ee4e140087afe108560"
    "labels/test-answers.csv": "82fe3127545b172d5e1a92641e5192bccfbea689d4b793d79f091239ce5cd2ad"
  notes: >-
    The official release: two archive parts 20bn-something-something-v2-00 (10 000 000 000 B) and -01
    (9 444 975 475 B), concatenated and untarred into a flat 20bn-something-something-v2/ of 220 847 webm
    (vp9, 12 fps, 240p, no audio), plus the 5 140 376 B labels zip (labels.json, train.json,
    validation.json, test.json, test-answers.csv). `bytes` = the two parts + the labels zip. The frozen
    manifest touches 44 777 of the 220 847 webm (4 020 523 417 B = budget.media_gb). The 27 157 test clips
    are on disk but not in the manifest.

obtain:   # who must act before the data can be staged here (yavih bench list); not hashed
  tier: needs-licence
  how: "Qualcomm developer portal: a human registers and accepts the Something-Something v2 licence, then downloads 19.4 GB"
budget:
  clips: {train: 20000, val: 24777}
  media_gb: 4.02
  extract_min_per_1k_clips_ref: 0.5
  probe_minutes_ref: {clf: 5}

manifest:
  file: manifest.csv.gz
  sha256: "80def82d6f17565978e963312f048e92732dcb85fca2626bd26c462cc4ec4777"
  classes: classes.csv
  classes_sha256: "cc184f05f25ec403848bbbb3b92cba9c0a103de986d5c7e7396bb49bb9c66552"
  key: clip_id
  label:
    column: label
    kind: single
    sep: ";"
    class_key: name
    sets: null
    train_set: null
    allow_unknown: false
    empty_ok: false
  columns:
    rel_media: {type: str, role: media, stream: video}
  upstream:
    source: "official labels/{labels,train,validation}.json of the Something-Something v2 release"
    sha256: "b24e46090960a49d732a0d3633fd939030b4eb717e16728871a3180b8704192b"
    rows: 193690
    draw: "official labels/train.json sha256 b24e46090960a49d732a0d3633fd939030b4eb717e16728871a3180b8704192b, class-balanced draw (yavih.freeze.class_balanced_subsample), cap 20000, seed 0"
    note: >-
      train rows are the seeded class-balanced draw of protocol.train_draw over the 168 913 upstream train rows
      (yavih.freeze.class_balanced_subsample, torch.Generator seed 0; 154 classes x 115, 18 x 116, and the two
      classes that run out: 'Poking a hole into some substance' 91, 'Spilling something behind something'
      111), in ascending upstream (train.json) order; the 148 913 rows not drawn are excluded.draw_remainder.
      val rows are all 24 777 upstream validation rows in validation.json order. clip_id = numeric video id;
      label = template with [ ] stripped; rel_media = 20bn-something-something-v2/<id>.webm.
    upstream_files:
      "labels/labels.json": "d98d8b657a5d418d7c05dbf630dedd34763025b3d764ceef19bbfd1dc654f54f"
      "labels/train.json": "b24e46090960a49d732a0d3633fd939030b4eb717e16728871a3180b8704192b"
      "labels/validation.json": "fbdd69ac72b40b9e3ed3aaf484e1575777152565caed693b0ced2d4959fd3958"
    curation:
      total_upstream: 193690
      per_split:
        train: {listed: 20000, staged: 20000, missing: 0}
        val: {listed: 24777, staged: 24777, missing: 0}
      excluded: {draw_remainder: 148913}
      short_clips: 0
      leakage_audit: null

splits:
  train: [train]
  eval: [val]
  floor: []
  folds: null
  unused: []
  min_eval_coverage: 0.95

streams:
  video:
    kind: video
    media_column: rel_media
    root: media_root
    layout: dir
    layout_params: {}
    required: true

targets: null

data:
  roots:
    media_root:
      default: "${data.root}/ssv2"
      description: >-
        SSv2 release root: 20bn-something-something-v2/<id>.webm (220 847 flat files, 19 GB; the manifest uses
        44 777) and labels/{labels,train,validation,test}.json + test-answers.csv.
  tar_index: null
  derived: {}

input_contract:
  handed_over:
    video: >-
      the SSv2 webm exactly as stored (vp9, 12 fps nominal with leading offsets and holes in ~8 % of clips,
      height 240, width 240-483, no audio track, 0.83-14.17 s, median 4.0 s), byte for byte; nothing
      decoded, cut, re-timed, resized or cropped
  info:
    video: [duration_s, fps, n_frames, width, height, container, bytes]
  facts: []
  materialize: null

output_contract:
  shape: fixed
  coordinates: media
  target_frame: null
  requires:
    pos: []
    streams: []
    grid: null
    t_bins: null

external: []

protocol:
  clip_seconds: null
  train_draw:
    cap: 20000
    seed: 0
    balance: class
  views: none

metrics:
  headline: acc
  list: [acc, n_eval]
  floors: [acc_floor]
  controls: []
  chance: {acc: 0.005747}
  ci: {acc: binomial}
  bootstrap: {samples: 2000, seed: 0}
  aggregation: null

readout_params: {}
