name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ruff
      - run: ruff check src tests

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # 3.15 waits for torch release wheels (cp315); the suite passed on it with torch's nightly CPU build.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm reads the version from the tags
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "setuptools>=77" "setuptools-scm>=10" wheel
          python -m pip install -e ".[media,dev]"
      - name: Versions
        run: |
          yavih --version
          python -c "import torch, numpy; print('torch', torch.__version__, 'numpy', numpy.__version__)"
      - name: Tests
        # no site data here: tests that need staged benchmark data skip
        run: pytest tests benchmarks -p no:cacheprovider -o addopts="--import-mode=importlib" -q -rfEs

  package:
    name: build and smoke-test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build sdist and wheel
        # --sdist --wheel builds both from the checkout, so the wheel records the source commit
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist --wheel
          ls -l dist
      - run: python -m twine check --strict dist/*
      - name: The wheel ships the core only (no benchmark folder, no repository docs)
        run: |
          python - <<'PY'
          import glob, zipfile
          (whl,) = glob.glob("dist/*.whl")
          names = zipfile.ZipFile(whl).namelist()
          bad = [n for n in names if n.endswith(".pyc") or n.startswith("docs/") or "/docs/" in n
                 or (n.startswith("yavih/benchmarks/") and n != "yavih/benchmarks/__init__.py")]
          assert not bad, bad[:20]
          assert "yavih/_version.py" in names
          print(whl, len(names), "files")
          PY
      - name: Install the wheel into a clean venv (no torch)
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install numpy pyyaml
          /tmp/venv/bin/python -m pip install --no-deps dist/*.whl
      - name: Smoke-test from an empty directory
        working-directory: ${{ runner.temp }}
        run: |
          /tmp/venv/bin/yavih --version
          /tmp/venv/bin/yavih bench list
          # the repository's folders read by the installed core, as fetched folders are read
          YAVIH_BENCH_PATH="$GITHUB_WORKSPACE/benchmarks" /tmp/venv/bin/yavih bench lint --all --skip conformance
          /tmp/venv/bin/yavih bench fetch esc50 --from "$GITHUB_WORKSPACE"
          /tmp/venv/bin/yavih bench files esc50
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
