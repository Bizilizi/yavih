name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 3 * * *"  # nightly: the full suite on every Python version
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Pull requests run one Python version; a pull request that changes only benchmark folders runs lint and the tests of
# those folders (plus the repository checks that read every folder, fast on a cached conformance verdict). Pushes to
# main run the full suite on one version; tags, the nightly schedule and a manual run use the whole matrix.
jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ruff
      - run: ruff check src tests benchmarks fleet

  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.diff.outputs.core }}
      folders: ${{ steps.diff.outputs.folders }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "core=true" >> "$GITHUB_OUTPUT"; echo "folders=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          folders="$(printf '%s\n' "$files" | sed -n 's#^benchmarks/\([a-z0-9_]*\)/.*#\1#p' | sort -u | while read -r n; do [ -f "benchmarks/$n/benchmark.yaml" ] && echo "$n"; done | tr '\n' ' ')"
          # anything outside an existing folder counts as core: a deleted folder, benchmarks/README.md, a stray file
          other="$(printf '%s\n' "$files" | grep -v '^$' | while read -r f; do
            n="$(printf '%s' "$f" | sed -n 's#^benchmarks/\([a-z0-9_]*\)/.*#\1#p')"
            if [ -z "$n" ] || [ ! -f "benchmarks/$n/benchmark.yaml" ]; then echo "$f"; fi
          done)"
          echo "core=$([ -n "$other" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "folders=$folders" >> "$GITHUB_OUTPUT"
          echo "core changes: ${other:-none}"; echo "folders: ${folders:-none}"

  fleet:
    # fleet/worker-brief.md: a pull request labelled `benchmark` adds or changes exactly one folder and nothing else,
    # under a name reserved in fleet/queue.yaml; every other pull request keeps the queue valid
    name: fleet (footprint and queue)
    if: github.event_name == 'pull_request'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - name: A benchmark pull request changes one folder only
        if: contains(github.event.pull_request.labels.*.name, 'benchmark')
        run: |
          set -- ${{ needs.changes.outputs.folders }}
          if [ "${{ needs.changes.outputs.core }}" = "true" ] || [ "$#" -ne 1 ]; then
            echo "a pull request labelled benchmark changes benchmarks/<name>/ of exactly one folder and nothing else"
            echo "(changes outside the folders: ${{ needs.changes.outputs.core }}; folders: ${*:-none})"
            exit 1
          fi
          python fleet/check.py footprint HEAD --base "origin/${{ github.base_ref }}" --name "$1"
          python fleet/check.py queue --allow-new "$1" || {
            echo "::error::benchmarks/$1/ needs an entry in fleet/queue.yaml before its benchmark pull request: add it"
            echo "in a separate one-line pull request (status: todo; keys at the top of the file) or ask a maintainer"
            echo "(docs/contributing-a-benchmark.md, step 1: reserve the name first)"
            exit 1
          }
      - name: The fleet queue
        if: "!contains(github.event.pull_request.labels.*.name, 'benchmark')"
        run: python fleet/check.py queue

  test-pr:
    name: pytest (pull request, Python 3.12)
    if: github.event_name == 'pull_request'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CONFORMANCE_CACHE_DIR: ${{ github.workspace }}/.conformance-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm reads the version from the tags; the catalog reads the history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@v4
        with:
          path: .conformance-cache
          # the same prefix as the 3.12 job on main, so a pull request restores main's verdicts
          key: conformance-3.12-${{ hashFiles('src/yavih/**/*.py') }}-${{ github.sha }}
          restore-keys: conformance-3.12-${{ hashFiles('src/yavih/**/*.py') }}-
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "setuptools>=77" "setuptools-scm>=10" wheel
          python -m pip install -e ".[media,dev]"
      - name: Generated tables and the catalog index (CI writes them; a contributor never does)
        run: |
          python -m yavih.doctables --write
          # the committed index must be what its own commit regenerates (a hand-edited index fails here, before
          # --write replaces it for the tests; a pull request's lagging index names an older commit and passes)
          python -m yavih.catalog --check
          python -m yavih.catalog --write
      - name: Tests (core changed)
        if: needs.changes.outputs.core == 'true'
        run: pytest tests benchmarks -p no:cacheprovider -o addopts="--import-mode=importlib" -q -rfEs
      - name: Tests (benchmark folders only)
        if: needs.changes.outputs.core != 'true' && needs.changes.outputs.folders != ''
        run: |
          yavih bench lint ${{ needs.changes.outputs.folders }}
          pytest $(for n in ${{ needs.changes.outputs.folders }}; do echo "benchmarks/$n"; done) \
            tests/test_packaged_folders.py tests/test_docs.py tests/test_catalog.py \
            -p no:cacheprovider -o addopts="--import-mode=importlib" -q -rfEs

  test:
    name: pytest (Python ${{ matrix.python-version }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CONFORMANCE_CACHE_DIR: ${{ github.workspace }}/.conformance-cache
    strategy:
      fail-fast: false
      matrix:
        # one version on a push to main; the whole matrix nightly, on tags and on a manual run.
        # 3.15 waits for torch release wheels (cp315); the suite passed on it with torch's nightly CPU build.
        python-version: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/main' && '["3.12"]' || '["3.10", "3.11", "3.12", "3.13", "3.14"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm reads the version from the tags
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@v4
        with:
          path: .conformance-cache
          key: conformance-${{ matrix.python-version }}-${{ hashFiles('src/yavih/**/*.py') }}-${{ github.sha }}
          restore-keys: conformance-${{ matrix.python-version }}-${{ hashFiles('src/yavih/**/*.py') }}-
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "setuptools>=77" "setuptools-scm>=10" wheel
          python -m pip install -e ".[media,dev]"
      - name: Versions
        run: |
          yavih --version
          python -c "import torch, numpy; print('torch', torch.__version__, 'numpy', numpy.__version__)"
      - name: Generated tables and the catalog index
        run: |
          python -m yavih.doctables --write
          # the committed index must be what its own commit regenerates (a hand-edited index fails here, before
          # --write replaces it for the tests; a pull request's lagging index names an older commit and passes)
          python -m yavih.catalog --check
          python -m yavih.catalog --write
      - name: Tests
        # no site data here: tests that need staged benchmark data skip
        run: pytest tests benchmarks -p no:cacheprovider -o addopts="--import-mode=importlib" -q -rfEs

  package:
    name: build and smoke-test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build sdist and wheel
        # --sdist --wheel builds both from the checkout, so the wheel records the source commit
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist --wheel
          ls -l dist
      - run: python -m twine check --strict dist/*
      - name: The wheel ships the core only (no benchmark folder, no repository docs)
        run: |
          python - <<'PY'
          import glob, zipfile
          (whl,) = glob.glob("dist/*.whl")
          names = zipfile.ZipFile(whl).namelist()
          bad = [n for n in names if n.endswith(".pyc") or n.startswith("docs/") or "/docs/" in n
                 or (n.startswith("yavih/benchmarks/") and n != "yavih/benchmarks/__init__.py")]
          assert not bad, bad[:20]
          assert "yavih/_version.py" in names
          print(whl, len(names), "files")
          PY
      - name: Install the wheel into a clean venv (no torch)
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install numpy pyyaml
          /tmp/venv/bin/python -m pip install --no-deps dist/*.whl
      - name: Smoke-test from an empty directory
        working-directory: ${{ runner.temp }}
        run: |
          /tmp/venv/bin/yavih --version
          /tmp/venv/bin/yavih bench list
          # the repository's folders read by the installed core, as fetched folders are read
          YAVIH_BENCH_PATH="$GITHUB_WORKSPACE/benchmarks" /tmp/venv/bin/yavih bench lint --all --skip conformance
          /tmp/venv/bin/yavih bench fetch esc50 --from "$GITHUB_WORKSPACE"
          /tmp/venv/bin/yavih bench files esc50
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
