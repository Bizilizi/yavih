name: render

# Renders every benchmark folder's README header image, reports the headers and README figures that are not current,
# and tiles the committed figures, into the `render` artifact for review. Each folder commits its own assets/
# (bench lint warns W_HEADER_* / W_PREVIEW_* / W_ASSET_SIZE); a contributor without Chrome takes a header PNG from this
# artifact (python -m yavih.headers <name> --html-only writes its sha file). CI holds no benchmark data, so figures are
# never re-rendered here. It never fails on a stale or missing image.
on:
  pull_request:
    paths:
      - "benchmarks/**"
      - "assets/design/**"
      - "assets/benchmark-header/**"
      - "src/yavih/design.py"
      - "src/yavih/headers.py"
      - "src/yavih/previews.py"
      - "src/yavih/media/figures.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    name: render the header images, check the figures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm reads the version from the tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[media]" imagequant
      - name: Chrome
        run: google-chrome --version
      - name: Headers that are missing or stale (information only)
        run: python -m yavih.headers --all --check || true
      - name: Render every header and the contact sheet
        run: python -m yavih.headers --all --contact-sheet headers-contact-sheet.png
      - name: Figures that are missing or stale (information only)
        run: python -m yavih.previews --all --check || true
      - name: Contact sheet of the committed figures
        run: python -m yavih.previews --all --contact-sheet previews-contact-sheet.png --committed || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render
          path: |
            headers-contact-sheet.png
            previews-contact-sheet.png
            benchmarks/*/assets/header.png
          if-no-files-found: warn
          retention-days: 14
