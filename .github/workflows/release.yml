name: Release

# Push a tag vX.Y.Z on main -> build, check, publish to PyPI (trusted publishing), GitHub Release with
# generated notes. See docs/releasing.md.
# Re-run for an existing tag: Actions -> Release -> Run workflow, tag = vX.Y.Z.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (vX.Y.Z)"
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: build ${{ github.event.inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0  # setuptools-scm reads the version from the tag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist --wheel
          ls -l dist
      - name: Built version must equal the tag
        run: |
          expected="${TAG#v}"
          for f in dist/*; do
            case "$(basename "$f")" in
              "yavih-${expected}.tar.gz"|"yavih-${expected}-py3-none-any.whl") ;;
              *) echo "::error::$(basename "$f") does not match tag ${TAG} (expected version ${expected})"; exit 1 ;;
            esac
          done
      - run: python -m twine check --strict dist/*
      - name: Smoke-test the wheel (no torch)
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install numpy pyyaml
          /tmp/venv/bin/python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          test "$(/tmp/venv/bin/yavih --version)" = "yavih ${TAG#v}"
          /tmp/venv/bin/yavih bench lint --all
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/yavih/
    permissions:
      id-token: write  # trusted publishing (OIDC); no API token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true  # a re-run for an already published tag only (re)creates the GitHub Release

  github-release:
    name: GitHub Release
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Notes are generated by GitHub from the pull requests merged since the previous tag, grouped by the
          # categories in .github/release.yml. A re-run for an existing release only refreshes the files.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "yavih ${TAG#v}" --generate-notes --verify-tag
          fi
