name: headers

# Renders every benchmark folder's README header image and a contact sheet into the `headers` artifact, for review.
# It never fails on a stale or missing image: contributors do not render headers (CI does); a maintainer commits the
# rendered PNG from the artifact when wanted (python -m yavih.headers <name> --html-only writes its sha file).
on:
  pull_request:
    paths:
      - "benchmarks/**"
      - "assets/benchmark-header/**"
      - "src/yavih/headers.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    name: render the header images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm reads the version from the tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[media]" imagequant
      - name: Chrome
        run: google-chrome --version
      - name: Render every header and the contact sheet
        run: python -m yavih.headers --all --contact-sheet headers-contact-sheet.png
      - name: Report the header sha files that are not current (information only)
        run: |
          python -m yavih.headers --all --html-only
          git status --porcelain -- 'benchmarks/*/assets/header.src.sha256' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headers
          path: |
            headers-contact-sheet.png
            benchmarks/*/assets/header.png
          if-no-files-found: warn
          retention-days: 14
