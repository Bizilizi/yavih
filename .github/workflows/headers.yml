name: headers

# Renders every benchmark folder's README header image for review and checks that the committed
# assets/header.src.sha256 files (the sha256 of the HTML each committed PNG was rendered from) are current.
on:
  pull_request:
    paths:
      - "src/yavih/benchmarks/**"
      - "assets/benchmark-header/**"
      - "src/yavih/headers.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    name: render the header images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm reads the version from the tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[media]" imagequant
      - name: Chrome
        run: google-chrome --version
      - name: Render every header and the contact sheet
        run: python -m yavih.headers --all --contact-sheet headers-contact-sheet.png
      - name: The committed header sha files are current
        run: |
          python -m yavih.headers --all --html-only
          changed="$(git status --porcelain -- 'src/yavih/benchmarks/*/assets/header.src.sha256')"
          if [ -n "$changed" ]; then
            echo "$changed"
            git diff -- 'src/yavih/benchmarks/*/assets/header.src.sha256'
            echo "::error::A header image is stale or missing its sha file: render it with 'python -m yavih.headers <name>' and commit assets/header.png and assets/header.src.sha256 (without Chrome: take the PNG from this run's 'headers' artifact and write the sha file with 'python -m yavih.headers <name> --html-only')."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headers
          path: |
            headers-contact-sheet.png
            src/yavih/benchmarks/*/assets/header.png
          if-no-files-found: warn
          retention-days: 14
