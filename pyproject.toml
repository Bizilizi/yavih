[build-system]
requires = ["setuptools>=77", "setuptools-scm>=10"]
build-backend = "setuptools.build_meta"

[project]
name = "yavih"
dynamic = ["version"]               # from the git tag vX.Y.Z (setuptools-scm, [tool.setuptools_scm] below)
description = "Frozen-feature benchmark harness for video and audio models"
readme = "README.md"
requires-python = ">=3.10"          # tomllib, or the tomli / vendored fallback
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniil Zverev" }]
keywords = ["benchmark", "evaluation", "frozen features", "linear probe", "attentive probe", "video", "audio",
            "audio-visual", "representation learning", "self-supervised learning"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Multimedia :: Video",
]
# Core is torch-free: numpy + pyyaml + stdlib only.
dependencies = ["numpy>=1.24", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/Bizilizi/yavih"
Repository = "https://github.com/Bizilizi/yavih"
Issues = "https://github.com/Bizilizi/yavih/issues"
Documentation = "https://github.com/Bizilizi/yavih/tree/main/docs"
Changelog = "https://github.com/Bizilizi/yavih/releases"

[project.optional-dependencies]
media = ["av>=11", "soundfile>=0.12", "pillow>=9", "scipy>=1.10"]
probe = ["torch>=2.1"]
# No extra for an original-author package (vggsounder, Probe3D, …): such packages are installed
# independently as each folder's setup.md "## Dependencies" says and reached only through
# yavih.external.require.
dev = ["pytest", "ruff", "scikit-learn>=1.3", "yavih[media,probe]"]  # scikit-learn: tests pin the numpy metrics against it

[project.scripts]
yavih = "yavih.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["yavih*"]
# a folder's maintainer notes/ and README header image (assets/) never ship
exclude = ["yavih.benchmarks.*.assets*", "yavih.benchmarks.*.notes*"]

[tool.setuptools.package-data]
yavih = [
  "benchmarks/README.md",          # the generated benchmark index
  "benchmarks/*/*",
  "benchmarks/*/prepare/*",
  "benchmarks/*/tests/*",
  "skill/yavih/*",
  "skill/yavih/references/*",
]

[tool.setuptools.exclude-package-data]
# the key is global because setuptools attributes benchmarks/__pycache__/* to the sub-package yavih.benchmarks;
# a folder's maintainer notes/ never ships (`yavih bench lint` E_NOTES_LINK), nor its README header image
# (assets/, rendered by `python -m yavih.headers` for the repository's README pages); each folder is a namespace
# package, so the patterns are relative to it
"*" = ["*.pyc", "__pycache__/*", "**/__pycache__/*", "notes/*", "notes/**/*", "assets/*", "assets/**/*"]

[tool.setuptools_scm]
# version = the nearest tag vX.Y.Z (X.Y.Z on the tag itself, X.Y.(Z+1).devN+g<commit> after it); the version file
# also carries the full source commit for yavih.buildinfo (GIT_HASH). Never committed (.gitignore).
version_file = "src/yavih/_version.py"
version_file_template = """# Generated by setuptools-scm at build / install time; not in version control.
__version__ = version = {version!r}
__version_tuple__ = version_tuple = {version_tuple!r}
__commit_id__ = commit_id = {scm_version.node!r}
__dirty__ = {scm_version.dirty!r}
"""
fallback_version = "0.0.0"          # a build without git metadata (a tarball of the tree, not an sdist)

[tool.pytest.ini_options]
testpaths = ["tests"]
# One convention for every test directory: importlib import mode, so the eleven
# benchmarks/<name>/tests/test_folder.py files share a basename without __init__.py files (a benchmark
# folder is data + scripts, never an importable package). `pythonpath` keeps the
# tests/ helper modules (test_plan_helpers, test_extract_fixtures, …) importable by their siblings.
addopts = "-q --import-mode=importlib"
pythonpath = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
